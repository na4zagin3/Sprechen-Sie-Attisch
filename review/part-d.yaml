      - engaging
      responds_to: null
      followed_by: null
      alternatives: []
    grammar:
      syntax: >
        ἄκουσον is an aorist imperative opening the appeal; ὦ γύναι is direct address. λόγον
        χαρίεντα is the object of λέξαι, while σοι is the beneficiary/addressee and βούλομαι
        governs the infinitive.
      literal_gloss: お聞きください、奥さん。あなたに面白い話をしたい。
      particles_and_idioms:
      - form: λόγος χαρίεις
        function: an amusing, witty, or pleasing tale rather than merely a “pretty” story
      pragmatic_force: requests attention and promises an entertaining story
    translation:
      variants:
      - de: Hören Sie einmal zu, gnädige Frau, ich will Ihnen eine hübsche Geschichte erzählen.
