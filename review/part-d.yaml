  - id: d-01-007
    source_locator:
      file: part-d.yaml
      section_index: 1
      conversation_index: 7
      fingerprint: 5dd93ca6f8839bdb
    source:
      modern:
      - de: Bitte, hören Sie auf, ich kann nicht mehr.
        ja: すみません、もう踊れませんからやめてください。
      grc:
      - παῦε δῆτ' ὀρχούμενος, !\footnote{\textlatin{sic}}
    dialogue:
      speaker:
        candidate: guest-b
        confidence: medium
      addressee:
        candidate: guest-a
        confidence: medium
      speech_act: request-to-stop
      tone:
      - fatigued
      - insistent
      responds_to: null
      followed_by: null
      alternatives: []
    grammar:
      syntax: >
        παῦε is a present imperative; ὀρχούμενος is a supplementary participle with παύομαι/παύω,
        “stop dancing.” δῆτα adds pressing or emphatic force.
      literal_gloss: ではもう、踊るのをやめてください。
      particles_and_idioms:
      - form: δῆτα
        function: reinforces the request; not inherently polite
      pragmatic_force: >
        The Greek expresses the request to stop, while German “ich kann nicht mehr” separately supplies
        the speaker’s reason.
    translation:
      variants:
      - de: Bitte, hören Sie auf, ich kann nicht mehr.
        ja_current: すみません、もう踊れませんからやめてください。
        ja_proposed: もうおやめください。これ以上は踊れません。
        decision: revise
        rationale: >
          Separating the request from the reason avoids making 「踊れませんからやめてください」 sound as
          though the addressee alone should stop for an unexplained reason.
        alternatives: []
      register: polite-but-firm
      scene_dependency: dance partner asking the other partner to stop
    attestations: []
    textual_issues:
    - type: punctuation
      source_text: "παῦε δῆτ' ὀρχούμενος, !"
      proposed_reading: "παῦε δῆτ’ ὀρχούμενος!"
      confidence: high
    review_comments: []
    status: ja-proposed
