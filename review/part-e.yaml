    grammar:
      syntax: "τἆλλα is the subject of λῆρός ἐστι; πρὸς Ἄνναν expresses comparison with Anna."
      literal_gloss: アンナに比べれば、ほかのものはたわごとだ。
      particles_and_idioms:
      - form: λῆρός ἐστι
        function: dismisses something as nonsense or worthless
      pragmatic_force: Extravagant praise of Anna at the expense of all rivals.
    translation:
      variants:
      - de: Alles nichts gegen meine Anna!
        ja_current: 我がアンナに比べれば大したことありませんよ。
        ja_proposed: 我がアンナに比べれば他の娘など物の数ではありません！
        decision: accepted
        rationale: >-
          「物の数ではない」naturally conveys Alles nichts gegen and the dismissive force of λῆρος,
          while retaining the speaker's polite register from the opening exchange.
