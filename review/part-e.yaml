meta:
  source: part-e.yaml
  part_title:
    de: Liebes\textcompwordmark{}glück und Liebes\textcompwordmark{}weh.
    ja: 恋の幸せと恋の苦しみ
  translation_style:
    basis:
    - part-a.yaml
    - part-b.yaml
    - part-c.yaml
    principles:
    - Prefer natural spoken Japanese appropriate to the reconstructed relationship.
    - Preserve the German wording except for explicitly identified source or OCR errors.
    - Distinguish the German prompt from the literal and pragmatic force of the Greek.
    - Check historical German meanings and idioms independently; record rather than conceal German-Greek mismatches.
    - Preserve nineteenth-century objects, institutions, and social conventions where relevant.
    - Do not add politeness, intimacy, gender, or aggression without contextual evidence.
    - Use Japanese punctuation and sentence endings to make turn-taking natural.
  corpus_roots:
    lsj: /home/mrty/Documents/Resources/LSJ_GreekUnicode
    canonical_corpus: /home/mrty/Documents/Resources/canonical-greekLit
    discovery_corpus: /home/mrty/Documents/Resources/ancient-greek-texts
  attestation_match_types:
  - exact
  - near-exact
  - adapted
  - syntactic-parallel
  - formulaic-parallel
  - lexical-only
  - not-found
  evidence_policy:
    languages: [grc, de]
    note: >-
      Translation-relevant attestations must remain in this review YAML with original text, source,
      context, relationship to the handbook, confidence, and research method. Record unsuccessful
      searches and label inference explicitly rather than leaving evidence only in discussion.
  status_values:
  - unreviewed
  - scene-reviewed
  - source-researched
  - ja-proposed
  - accepted
scenes:
- id: e-01
  title:
    de: Liebes\textcompwordmark{}sehnsucht
    ja: 恋のあこがれ
  scene_type: mixed
  setting:
    situation: a lover confides longing for Anna
  cast:
  - id: lover
    description: Person strongly attached to Anna; speaks plainly with an intimate confidant.
    evidence: "meine Anna; Sehnsucht nach Anna; repeated du-forms in the informal exchange"
    confidence: high
  - id: confidant
    description: Familiar interlocutor who questions, observes Anna, and offers blunt advice.
    evidence: "Du wunderst dich?; Sei kein Thor!; Siehst du nicht?; Kümmere dich nicht weiter um sie!"
    confidence: high
  - id: Anna
    description: Woman discussed and later observed; no securely assigned spoken turn in this section.
    evidence: "third-person references throughout entries e-01-001 through e-01-023"
    confidence: high
  - id: formal-speaker
    description: Speaker in reusable polite model phrases; not securely identical with lover or confidant.
    evidence: "Sie in e-01-001 and Ihnen in e-01-026 contrast with the informal du-run"
    confidence: medium
  reconstruction:
    confidence: high
    note: >-
      The ordering contains several usable dialogue runs rather than one continuous scene. Entries 1-3 form a
      formal question and confession; 4-9 form an informal response; 10-13 present Anna's approach, while 14 is
      an alternative observation incompatible with 13 as a strict next turn; 15-23 form an informal jealous
      exchange; 24-26 are polite greeting formulas whose speakers and referents are not securely continuous.
  voice_profiles:
    informal_lover:
      register: plain
      traits: [emotional, romantic, jealous]
      japanese_policy: "Use restrained plain speech; omit pronouns unless contrast requires them."
    informal_confidant:
      register: plain
      traits: [direct, teasing, corrective]
      japanese_policy: "Use concise plain forms without unsupported insults such as お前."
    formal_model_phrases:
      register: polite
      traits: [socially courteous]
      japanese_policy: "Use です／ます and do not assume that these turns belong to the informal pair."
  turn_groups:
  - entries: [e-01-001, e-01-002, e-01-003]
    description: formal inquiry followed by the lover's confession
  - entries: [e-01-004, e-01-005, e-01-006, e-01-007, e-01-008, e-01-009]
    description: informal reaction, defence, lament, rebuke, and further lament
  - entries: [e-01-010, e-01-011, e-01-012, e-01-013]
    description: Anna is absent, approaches, and is finally seen
  - entries: [e-01-014]
    description: alternative model phrase, not a strict continuation after e-01-013
  - entries: [e-01-015, e-01-016, e-01-017, e-01-018, e-01-019, e-01-020, e-01-021, e-01-022, e-01-023]
    description: informal jealous exchange between lover and confidant
  - entries: [e-01-024, e-01-025, e-01-026]
    description: polite greeting formulas; exact continuity and referents remain uncertain
