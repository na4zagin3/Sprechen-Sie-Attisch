      text_grc: οὔκουν ἐπείξῃ τῷδε δεσμὰ περιβαλεῖν;
      original_speakers:
      - Κράτος
      original_scene: >-
        Hephaestus reluctantly accepts that he must bind Prometheus. Kratos impatiently presses him to put the
        fetters on before Zeus sees him idling.
      relationship_to_handbook: >-
        Direct parallel for the impatient future question. The handbook removes the infinitival complement and
        prints ἐπείξει where the source and LSJ have second-person future middle ἐπείξῃ.
      adaptations:
      - complement τῷδε δεσμὰ περιβαλεῖν omitted
      confidence: high
      research_method: construction and dramatic context checked against LSJ and the local canonical corpus
    textual_issues:
    - type: probable-form-error
      source_text: ἐπείξει
      proposed_reading: ἐπείξῃ
      note: >-
