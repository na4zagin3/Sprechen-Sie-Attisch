      original_scene: >-
        Chremylus says that he is already setting out to take Plutus to Asclepius; Blepsidemus adds this brisk
        final prompt, and Chremylus replies that he is doing precisely that.
      relationship_to_handbook: Verbatim exhortation used as one Greek equivalent of the German head phrase.
      adaptations: []
