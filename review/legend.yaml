    review_comments:
      - "The quote grammatically continues the previous entry after 'Griechisch ist'; starting with それは is acceptable, but あらゆる言語の中の言語であり is closer."
      - "Grandezza is intentionally Italian/foreign in German; leaving グランデッツァ or adding 威厳 both work. 荘重なグランデッツァ preserves the foreignness."
      - "geläutert is more 浄化され than 精錬され, though 精錬 works well with the metal metaphor."
      - "Structure: hier sind sie vereinigt refers back to all the national-language qualities just listed."
      - "The German uses singular national persons (des Spaniers, des Italieners, etc.), not the language names themselves; the revision preserves that personification consistently."
      - "精錬 and 溶け合う retain the single metallurgical image running through geläutert and zusammengeschmolzen."
