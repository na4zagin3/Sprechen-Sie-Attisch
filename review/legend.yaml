meta:
  source: legend.tex
  translation: legend-ja.tex
  purpose: >
    Working file for German-Japanese translation review. Preserve the German
    source text as given, except for likely OCR or comparable transcription
    errors. The review target is the Japanese translation.
  status_values:
    - needs-review
    - source-checked
    - ja-revised
    - accepted

terms:
  Attiker_person:
    de: Attiker
    ja: ア\jdb{テ}ーナイ人
    note: >
      For persons, use the singular place-name based Japanese form requested
      by the user. Avoid アッティカ人 unless the source clearly means an
      inhabitant of Attica more broadly.
  attische_Umgangssprache:
    de: attische Umgangssprache
    ja_options:
      - アッティカ方言口語
      - ア\jdb{テ}ーナイの日常語
      - アッティカの日常口語
    note: >
      Decide by context. The phrase often means everyday spoken Attic, not
      merely a formal dialect label.

entries:
  - id: legend-001-title
    de_location: legend.tex:1
    ja_location: legend-ja.tex:3-5
    de: |-
      Vorbemerkungen
    ja_current: |-
      前言
    ja_revised: |-
      前言
    vocab:
      - de: Vorbemerkungen
        ja_options: ["前言", "序言", "前置き"]
        note: "A prefatory remarks heading; not quite 凡例 unless the section is treated as editorial conventions."
    notes:
      - "Full German TOC title: Vorbemerkungen über die Bedeutung der attischen Umgangssprache für das Erlernen des Griechischen."
      - "Japanese TOC title currently renders the full title."
    status: needs-review
    review_comments:
      - "前言 is fine for a preface-like section. 凡例 would suggest editorial conventions more strongly than this passage does."

  - id: legend-002-unlearnable-language
    de_location: legend.tex:3-8
    ja_location: legend-ja.tex:8-23
    de: |-
      Griechisch gilt den Allermeisten für eine im Grunde unlernbare Sprache,
      deren man nimmermehr so mächtig werden könne, wie einer neueren, die
      man leidlich beherrscht. Vorliegendes Büchlein, das fröhlicher Ferienlaune
      seinen Ursprung verdankt, möchte den Gegenbeweis führen, indem es
      einen ersten Versuch macht, attische Umgangs\textcompwordmark{}sprache
      in ihren gebräuchlichsten Wendungen zu lehren.
    ja_current: |-
      ギリシャ語は、ほとんどの人にとり、基本的に学べない言語と考えられており、
      まともに把握している現代言語ほどには決して習熟できないものと思われている。
      本小書は、明るい休暇気分の気分がその発端となったもので、
      アッティカ方言口語を最も一般的な言い囘しで教えることで、その反証を試みるものだ。
    ja_revised: |-
      ギリシャ語は、ほとんどの人にとり、根本的には習得できない言語と考えられており、
      世人がそこそこ使いこなせる所の近代語ほどには決して習熟できないものと思われている。
      本小書は、明るい休暇気分の気分がその発端となったもので、
      アッティカ方言口語を最もよく用いられる言い回しで教えることで、その反証を試みるものである。
    gloss:
      - "den Allermeisten: to the great majority."
      - "im Grunde unlernbare Sprache: basically/fundamentally unlearnable language."
      - "nimmermehr so mächtig werden: never become as commandingly proficient in it."
      - "fröhlicher Ferienlaune: cheerful holiday mood."
      - "Gegenbeweis führen: furnish the counterproof."
    vocab:
      - de: Griechisch
        ja_options: ["ギリシャ語"]
        note: "Object of the whole pedagogical defense."
      - de: den Allermeisten
        ja_options: ["ほとんどの人にとって", "大多数の人には"]
        note: "Dative of viewpoint."
      - de: unlernbare Sprache
        ja_options: ["習得できない言語", "学びえない言語"]
        note: "Core polemical label repeated later as the source of Greek's opponents."
      - de: mächtig werden
        ja_options: ["自在に扱えるようになる", "習熟する"]
        note: "Command/mastery, stronger than simply 知る."
      - de: leidlich beherrscht
        ja_options: ["そこそこ使いこなせる", "一応ものにしている"]
        note: "Passable command of a modern language."
      - de: fröhliche Ferienlaune
        ja_options: ["明るい休暇気分", "楽しい休暇の気分"]
        note: "Self-deprecating origin of the booklet."
      - de: Gegenbeweis
        ja_options: ["反証"]
        note: "The booklet aims to refute the unlearnability claim."
    notes:
      - "Review まともに把握 for leidlich beherrscht; the German means 'reasonably/master passably'."
      - "Keep German unchanged unless OCR issues appear."
    status: needs-review
    review_comments:
      - 'Should I translate "wie einer neueren, die man leidlich beherrscht" like as "そこそこ学べるとされている現代言語ほどには"?'
      - "I would use そこそこ使いこなせる近代語ほどには. The point is not that modern languages are considered learnable in theory, but that one may actually command one passably."
      - "近代語 is closer to neueren than 現代言語 if you want the older philological register; 現代語 is also acceptable."
      - "Fix typo: 明るい休暇気分の気分 repeats 気分. Use 明るい休暇気分から生まれたもので or 明るい休暇気分に発したもので."
      - "世人がそこそこ使いこなせる所の近代語 is understandable but heavy; そこそこ使いこなせる近代語ほどには is cleaner and closer to wie einer neueren, die man leidlich beherrscht."

  - id: legend-003-key-to-literature
    de_location: legend.tex:10-12
    ja_location: legend-ja.tex:26-36
    de: |-
      Wer die Umgangs\textcompwordmark{}sprache eines Volkes kennt, hat
      den Schlüssel zum Verständniß seiner Schriftwerke gleich den Volks\textcompwordmark{}genossen
      selbst.
    ja_current: |-
      ある民族の口語を知っている人は、その民族の書かれた作品をその民族同胞と同じように
      理解する鍵を持っている。
    ja_revised: |-
      ある民族の口語を知る者は、その民族同胞と同じように、
      その民族の著作を理解する鍵を手にしている。
    gloss:
      - "Schriftwerke: written works, literature."
      - "gleich den Volksgenossen selbst: just like the members of that people themselves."
    vocab:
      - de: Umgangssprache
        ja_options: ["口語", "日常口語"]
        note: "Everyday spoken language; key term throughout."
      - de: Volk
        ja_options: ["民族", "国民"]
        note: "Here a people/language community."
      - de: Schlüssel
        ja_options: ["鍵"]
        note: "Metaphor: everyday speech unlocks written works."
      - de: Verständniß
        ja_options: ["理解"]
        note: "Old spelling of Verständnis."
      - de: Schriftwerke
        ja_options: ["文献", "著作", "書かれた作品"]
        note: "Broad written works, not necessarily only literary art."
      - de: Volksgenossen
        ja_options: ["同じ民族の人々", "民族同胞"]
        note: "Members of the same people."
    notes:
      - "Current Japanese is accurate; consider 文献/著作 for Schriftwerke depending on register."
    status: needs-review
    review_comments:
      - 'Maybe we should translate Schriftwerke as 文学作品 or 著作'
      - "文献 is the safest here: broad enough for written works, less narrow than 文学作品, less author-centered than 著作."
      - "If you want a more literary tone, 書かれた作品 is also fine, but it is a little explanatory."
      - "その民族同胞 is a little compressed; その民族の同胞 or 同じ民族の人々 reads more naturally."

  - id: legend-004-attic-boy-and-farmer
    de_location: legend.tex:14-20
    ja_location: legend-ja.tex:39-55
    de: |-
      Der attische Knabe brachte zur Lectüre griechischer Dichter, der attische
      Bauer in sein Theater oder in die Volks\-ver\-samm\-lung nur die
      Kenntniß der attischen Umgangs\textcompwordmark{}sprache in ihrer
      einfachsten Form mit; \emph{sie} befähigte zum Verständniß sophokleïscher
      Dramen und perikleïscher Reden. Die Sprache des Alltags\textcompwordmark{}lebens
      lieferte diejenigen Analogien, welche zum Erfassen der höheren Erzeugnisse
      in Rede und Schrift nothwendig waren.
    ja_current: |-
      アッティカの少年はギリシャ詩人の朗読に、また、アッティカの農民は劇場や公会に、アッ
      ティカ方言口語の最も単純な形の知識だけを持っていった。
      \emph{その}おかげで、ソ\jdb{ポ}クレースの劇やペリクレースの演説が理解できたのだ。
      日常生活の言語は、演説や書物における高度な作品を理解するために必要な\ruby{類似}{アナロジー}を与えていたのだ。
    ja_revised: |-
      アッティカの少年はギリシャ詩人の読書に、また、アッティカの農民は劇場や民会に、アッティカ方言口語の最も素朴な形の知識だけを持っていった。
      \emph{その知識}により、ソ\jdb{ポ}クレースの劇やペリクレースの演説が理解できたのだ。
      日常生活の言語は、弁論や書物における高度な産物を理解するために必要な\ruby{類似}{アナロジー}を与えていたのだ。
    gloss:
      - "brachte ... mit: brought with him, had at hand as equipment."
      - "Lectüre griechischer Dichter: reading Greek poets."
      - "Volksversammlung: popular assembly."
      - "höhere Erzeugnisse in Rede und Schrift: higher productions in speech and writing."
    vocab:
      - de: attischer Knabe
        ja_options: ["アッティカの少年"]
        note: "Native child as example of everyday language competence."
      - de: Lectüre
        ja_options: ["読解", "読むこと", "作品に接すること"]
        note: "Educational/literary reading; not necessarily private silent reading."
      - de: attischer Bauer
        ja_options: ["アッティカの農民"]
        note: "Ordinary native speaker in civic/theatrical settings."
      - de: Volksversammlung
        ja_options: ["民会"]
        note: "Athenian assembly context."
      - de: in ihrer einfachsten Form
        ja_options: ["最も素朴な形で", "ごく基本的な形で"]
        note: "Modifies Umgangssprache, not Kenntniß."
      - de: befähigte
        ja_options: ["可能にした", "理解する力を与えた"]
        note: "The simple spoken language gives access to higher works."
      - de: Analogien
        ja_options: ["類推の手がかり", "類比"]
        note: "Daily language supplies analogies for interpreting elevated expression."
      - de: Erzeugnisse
        ja_options: ["産物", "作品", "言語的産物"]
        note: "Actual higher productions in speech/writing, e.g. dramas and speeches."
    notes:
      - "Review 公会 for Volksversammlung; 民会 may fit Athens better."
      - "朗読 may be too narrow for Lectüre."
    status: needs-review
    review_comments:
      - 'Yes, we should use 民会'
      - 'Lectüre: Hmm, what Japanese phrases would fit better?'
      - "For Lectüre, ギリシャ詩人を読むとき is better than 朗読 unless you specifically want oral reading. 読解に際して is more scholastic, but less natural here."
      - "公会 should become 民会 in this Athenian political context."
      - "Analogien is better as 類推の手がかり than bare 類似, because the sentence is about interpretive analogies supplied by daily speech."
      - "ギリシャ詩人の読書 is awkward and can sound like 'the poet's reading'. Prefer ギリシャ詩人の作品に接するにあたって or ギリシャ詩人を読むにあたって."
      - "持っていった is understandable, but 携えていた better matches brachte ... mit as an available equipment/background."

  - id: legend-005-core-vocabulary
    de_location: legend.tex:22-28
    ja_location: legend-ja.tex:58-74
    de: |-
      Man hat oft behauptet, daß es erstaunlich wenig Worte und Wendungen
      sind, mit denen der gemeine Mann in seiner Muttersprache aus\textcompwordmark{}kommt
      und die ihn befähigen, auch das zu verstehen, was für ihn Neubildung
      ist. Sollte es nicht möglich sein, dem Athener seinen verhältnißmäßig
      kleinen Urvorrath abzulauschen, somit die Sprache in ihrem \emph{Kerne}
      zu erfassen und diese Worte und Wendungen demjenigen, der Griechisch
      wirklich lernen will, geläufig zu machen?
    ja_current: |-
      民衆が母語として獲得し、使いこなすことで新造語の意味すら理解できるようになる語や言いまわしの数は驚くほど少ないことがしばしば指摘される。
      それならばア\jdb{テ}ーナイ人から比較的少数の根源的語彙を聴き写し、
      言語の\emph{核心}を捉え、
      ギリシャ語を本当に学びたい人にこれらの言辞や言いまわしを馴染ませることも不可能ではなかろう。
    ja_revised: |-
      大衆が母語として遣り繰りし、また、以って新造語の意味すら理解できるようになる所の言辞や言いまわしの数というのは驚くほど少ないことがしばしば指摘される。
      それならば、ギリシャ語を本当に学びたい人に、ア\jdb{テ}ーナイ人から比較的少数の根源的語彙を聞き覚えることで、
      言語の\emph{核心}を捉えさせ、
      これらの語や言いまわしを馴染ませることも可能ではなかろうか。
    gloss:
      - "gemeine Mann: common man, ordinary person."
      - "auskommt: gets by, manages."
      - "Neubildung: new formation, newly formed expression."
      - "Urvorrath: original/basic stock."
      - "ablauschen: overhear/listen out from, learn by listening closely."
      - "geläufig machen: make familiar/fluent."
    vocab:
      - de: gemeine Mann
        ja_options: ["普通の人", "一般の人"]
        note: "Socially ordinary person; avoid overly political 大衆 if not needed."
      - de: auskommen mit
        ja_options: ["それで用を足す", "それでやっていく"]
        note: "Intransitive verb with mit + dative."
      - de: Worte und Wendungen
        ja_options: ["語や言い回し", "語と表現"]
        note: "Core phrase inventory, not abstract diction."
      - de: Neubildung
        ja_options: ["新しい言い方", "新形成語"]
        note: "New linguistic formation; not necessarily formal neologism only."
      - de: dem Athener
        ja_options: ["ア\\jdb{テ}ーナイ人から"]
        note: "Dative with ablauschen; a native Athenian speaker, not literature itself."
      - de: Urvorrath
        ja_options: ["基礎語彙", "根源的語彙"]
        note: "Basic original stock of words/phrases."
      - de: in ihrem Kerne
        ja_options: ["その核心において", "核心を"]
        note: "The core of the language is found in basic everyday usage."
    notes:
      - "Current Japanese front-loads Neubildung and may obscure the syntax."
      - "言辞 may be too literary for Worte here."
    status: needs-review
    review_comments:
      - 'Could you please give some options to polish Japanese translations'
      - "Option A, literal and clear: 普通の人が母語で用を足し、また自分にとって新しい言い方まで理解できるようになるために必要な語や言い回しは、驚くほど少ない。"
      - "Option B, smoother: 普通の人は、驚くほど少ない語と表現だけで母語を使いこなし、自分にとって新しい言い方まで理解している。"
      - "Avoid 言辞 here; 語や言い回し is more transparent and closer to Worte und Wendungen."
      - "ablauschen is not exactly 聴き写す; 聞き取る or 聞き出す is better. 聞き取る keeps the observing/listening nuance."
      - "大衆 is stronger and more collective than der gemeine Mann. 普通の人 or 一般の人 is safer."
      - "母語として遣り繰りし is not idiomatic for auskommt. Use 母語で用を足している or 母語でやっていく."
      - "The second sentence currently makes the learner do the listening to the Athenian. In German, the coordinated infinitives are the proposed task: 'to listen out the stock from the Athenian, grasp the core, and make these words familiar to the learner'."

  - id: legend-006-aristophanes-material
    de_location: legend.tex:30-36
    ja_location: legend-ja.tex:77-93
    de: |-
      Aristophanes bietet für diesen Zweck in denjenigen Partien, wo er
      den gemeinen Mann im volks\textcompwordmark{}thümlichen Verkehrs\textcompwordmark{}tone
      reden läßt, sprachlichen Stoff genug, und auch in der übrigen Literatur
      finden sich verstreut Stellen, welche für treue Nachahmungen der Sprache
      des gemeinen Lebens gelten müssen. Die Aufgabe kann also nicht unlös\textcompwordmark{}bar
      sein, wenn auch das vorliegende Schrift\textcompwordmark{}chen nur
      erst einen kleinen Beitrag zu ihrer Lösung bringt.
    ja_current: |-
      アリスト\jdb{パ}ネースは、民衆を庶民的な調子で語らせる箇所で、この目的に十分な言
      語資料を提供している。
      その他の文学作品にも、庶民生活の言葉の忠実な模倣と見なせる箇所が散在している。\todo{この節ここまで校了}%
      従って、この課題は解決不可能であるはずはない。もっとも、本小書がその解決に寄与するところは、まだほんの僅かに過ぎないのであるが。
    ja_revised: |-
      アリスト\jdb{パ}ネースは、市井の人々を庶民的な交際の調子で語らせる箇所で、
      この目的に十分な言語資料を提供している。
      その他の文学作品にも、市井の暮らしの言葉の忠実な模倣と見なせる箇所が散在している。
      従って、この課題は解決不可能であるはずはない。もっとも、本小書がその解決に寄与するところは、まだほんの僅かに過ぎないのであるが。
    gloss:
      - "volksthümlicher Verkehrston: popular/everyday conversational tone."
      - "sprachlicher Stoff genug: enough linguistic material."
      - "treue Nachahmungen: faithful imitations."
      - "nur erst: only as yet."
    vocab:
      - de: Aristophanes
        ja_options: ["アリスト\\jdb{パ}ネース"]
        note: "Primary source for colloquial Attic in the booklet."
      - de: Partien
        ja_options: ["箇所", "部分"]
        note: "Passages in Aristophanes."
      - de: volksthümlicher Verkehrston
        ja_options: ["庶民的な交際の調子", "日常の会話調"]
        note: "Popular interaction tone; useful for ordinary speech."
      - de: sprachlicher Stoff
        ja_options: ["言語資料"]
        note: "Material for constructing/teaching expressions."
      - de: übrige Literatur
        ja_options: ["その他の文学", "他の文献"]
        note: "Other Greek literature beyond Aristophanes."
      - de: treue Nachahmungen
        ja_options: ["忠実な模倣"]
        note: "Attested literary imitations of everyday language."
      - de: Aufgabe
        ja_options: ["課題"]
        note: "The project of recovering/teaching everyday Attic."
      - de: Schriftchen
        ja_options: ["本小書", "この小冊子"]
        note: "Modest diminutive."
    notes:
      - "The queried sentence is translated correctly in broad sense."
      - "The German contains line-break word marks in source; preserve unless normalizing only in review notes."
    status: needs-review
    review_comments:
      - "庶民的な調子 is acceptable, but 庶民的な交際の調子 or 日常の会話調 makes Verkehrston more visible."
      - "gelten müssen is stronger than 見なせる: 見なさねばならない or 見るべきである is closer."
      - "only a small contribution: 小さな一寄与をなすにすぎない is stiffer but faithful; current ほんの僅かに過ぎない is smoother."
      - "Current ja_revised still has 見なせる, which weakens gelten müssen. Consider 見なさねばならない or 見るべきである."

  - id: legend-007-sources-of-words
    de_location: legend.tex:38-42
    ja_location: legend-ja.tex:96-109
    de: |-
      Die Worte und Wendungen in den nachstehenden Gesprächen sind in der
      Hauptsache der aristophanischen Sprache entnommen. Einiges mußte aus
      der späteren Gräcität beigefügt werden. Die dem Neugriechischen entlehnten
      Ergänzungen, welche zur Bezeichnung moderner Begriffe verwandt wurden,
      sind durch {*} besonders kenntlich gemacht.
    ja_current: |-
      以下の会話に出てくる語と表現は、おおむねアリスト\jdb{パ}ネースの言葉から採った。
      いくらかは後代のギリシャ語から補わねばならなかった。
      現代ギリシャ語から借り、近代的概念を表すために用いた補足語句は、特に {*} で示してある。
    ja_revised: |-
      以下の会話に出てくる語と表現は、主としてアリスト\jdb{パ}ネースの言葉から採ったものである。
      いくらかは後代のギリシャ語から補わざるをえなかった。
      近代的な概念を表すために用いた、現代ギリシャ語由来の補足語句は、特に {*} で示してある。
    gloss:
      - "in der Hauptsache: chiefly, for the most part."
      - "spätere Gräcität: later Greek usage/Greekness."
      - "kenntlich gemacht: marked, made recognizable."
    vocab:
      - de: nachstehende Gespräche
        ja_options: ["以下の会話"]
        note: "The dialogue sections following the preface."
      - de: aristophanische Sprache
        ja_options: ["アリスト\\jdb{パ}ネースの言葉", "アリストパネス的な語法"]
        note: "Language/usage attested in Aristophanes."
      - de: in der Hauptsache
        ja_options: ["主として", "おおむね"]
        note: "Chiefly, not exclusively."
      - de: spätere Gräcität
        ja_options: ["後代のギリシャ語", "後代ギリシャ語法"]
        note: "Learned term for later Greek usage."
      - de: mußte ... beigefügt werden
        ja_options: ["補わざるをえなかった"]
        note: "Necessity, not enthusiastic borrowing."
      - de: Neugriechisch
        ja_options: ["現代ギリシャ語"]
        note: "Source for modern-concept supplements."
      - de: Ergänzungen
        ja_options: ["補足語句", "補足"]
        note: "Marked with {*}."
    notes:
      - "Current Japanese is straightforward."
    status: needs-review
    review_comments:
      - "おおむね is fine, but 主として mirrors in der Hauptsache a bit more formally."
      - "補わねばならなかった is accurate; 補わざるをえなかった makes mußte clearer."
      - "This entry looks solid. If you want to show mild reluctance in mußte, 不足する分はいくらか、後代のギリシャ語から補わざるをえなかった is a good option."

  - id: legend-008-usefulness-beyond-conversation
    de_location: legend.tex:44-57
    ja_location: legend-ja.tex:112-138
    de: |-
      Auch wer nicht die Absicht hat, attisch conversiren zu lernen, wird
      mit vielem Nutzen für sein Verständniß des Griechischen sich mit der
      attischen Umgangs\textcompwordmark{}sprache beschäftigen. Denn während
      man auf unseren Gymnasien im Lateinischen fast nur solche Schriften
      liest, welche der höheren Kunst\textcompwordmark{}sprache angehören
      --- man denke nur an Cicero und Tacitus --- und in welchen die Volks\textcompwordmark{}sprache
      kaum hier und da er\textcompwordmark{}kennbar ist, werden wir im
      Griechischen weit mehr auf die Sprache des gewöhnlichen Lebens hin\textcompwordmark{}gewiesen.
      Im Griechischen lesen wir Gespräche bei den Dramatikern, Gespräche
      bei Plato; die Redner sprechen nicht zu Senatoren, sondern werben um die Stimme
      des gemeinsten Mannes, --- schon \emph{dies}
      nöthigt sie, seiner Sprache nahe zu bleiben, und schon dies muß die
      Kenntniß der Aus\textcompwordmark{}drucks\textcompwordmark{}weise
      des täglichen Lebens im Griechischen nützlich machen zum feinfühligeren
      Verständniß der Texte.
    ja_current: |-
      アッティカ語で会話できるようになるつもりのない人でも、ギリシャ語理解のためにアッティカ方言口語に取り組むことは大いに役立つ。
      というのも、私たちのギムナジウムでは、ラテン語ではほとんど高尚な文語に属する著作ばかりを読む%
      ——キケローやタキトゥスを思い起こせばよい——そしてそれらの中では民衆語はところどころにかすかに認められるだけである。
      それに比べて、ギリシャ語では日常生活の言葉にずっと多く向き合わされる。
      ギリシャ語では、劇作家の対話もプラトーンの対話も読む。弁論家たちは元老院議員に語りかけるのではなく、
      ごく普通の人の声を得ようとする。
      ごく普通の人の声を扱うこと自体が、彼らをその人の言葉遣いの近くにとどまらせる。
      そしてこのことだけでも、ギリシャ語の日常的な表現法を知ることは、テキストをより繊細に理解するために有用なものとなる。
    ja_revised: |-
      アッティカ方言での会話を習うつもりのない人であっても、
      ギリシャ語理解のためにアッティカ方言の日常口語に取り組むことは大いに役立つ。
      我々のギムナジウムでは、ラテン語についてはほとんど高尚な文語に属する著作ばかり——キケローやタキトゥスを思い浮かべればよい——を読み、
      そしてそれらの著作では、民衆語はせいぜい所々にかすかに認められるにすぎないが、
      翻って、ギリシャ語では日常生活の言葉にずっと多く向き合わされるからである。
      ギリシャ語では、劇作家の戯曲中の会話も、プラトーンの作品中の会話も読む。
      弁論家は元老院議員に向かって語るのではなく、最もありふれた人の声を得ようとする。
      このことは、彼らを最もありふれた人の言葉に近いところへ留めており、
      そしてこのことは、ギリシャ語の日常生活の表現法を知ることを、
      テキストを精緻に理解するために有用なものとするに違いない。
    gloss:
      - "conversiren: converse."
      - "höhere Kunstsprache: elevated literary/art language."
      - "hier und da erkennbar: recognizable here and there."
      - "Redner: orators/speakers."
      - "werben um die Stimme: canvass/solicit the vote/voice."
      - "gemeinster Mann: the most ordinary/common man."
      - "feinfühligeres Verständnis: more sensitive understanding."
    vocab:
      - de: attisch conversiren
        ja_options: ["アッティカ方言で会話できるようになる"]
        note: "lernen here is acquiring ability, not merely studying."
      - de: sich beschäftigen mit
        ja_options: ["取り組む"]
        note: "Study/engage with."
      - de: Kunstsprache
        ja_options: ["高尚な文語", "人工的・文学的な高等語"]
        note: "Elevated literary language, contrasted with Volkssprache."
      - de: Volkssprache
        ja_options: ["民衆語", "日常語"]
        note: "Popular/common speech."
      - de: hingewiesen werden auf
        ja_options: ["目を向けさせられる", "向き合わされる"]
        note: "Passive of hinweisen auf; not 'addressed to'."
      - de: Gespräche bei den Dramatikern/bei Plato
        ja_options: ["劇作家たち/プラトーンの作品における対話"]
        note: "bei = in the works/passages of."
      - de: Redner
        ja_options: ["弁論家たち"]
