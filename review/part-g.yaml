meta:
  source: part-g.yaml
  part_title:
    de: Aus dem politischen Leben.
    ja: 政治生活より
  translation_style:
    basis:
    - part-a.yaml
    - part-b.yaml
    - part-c.yaml
    principles:
    - Prefer natural spoken Japanese appropriate to the reconstructed relationship.
    - Preserve the German wording except for explicitly identified source or OCR errors.
    - Distinguish the German prompt from the literal and pragmatic force of the Greek.
    - Check historical German meanings and idioms independently; record rather than conceal German-Greek mismatches.
    - Preserve nineteenth-century objects, institutions, and social conventions where relevant.
    - Reproduce emphasis in Japanese only when the corresponding German text is emphasized; Greek-only emphasis is not carried into ja_proposed.
    - Do not add politeness, intimacy, gender, or aggression without contextual evidence.
    - Use Japanese punctuation and sentence endings to make turn-taking natural.
  corpus_roots:
    lsj: /home/mrty/Documents/Resources/LSJ_GreekUnicode
    canonical_corpus: /home/mrty/Documents/Resources/canonical-greekLit
    discovery_corpus: /home/mrty/Documents/Resources/ancient-greek-texts
  attestation_match_types:
  - exact
  - near-exact
  - adapted
  - syntactic-parallel
  - formulaic-parallel
  - lexical-only
  - not-found
  evidence_policy:
    languages: [grc, de]
    note: >-
      Translation-relevant attestations must remain in this review YAML with original text, source,
      context, relationship to the handbook, confidence, and research method. Record unsuccessful
      searches and label inference explicitly rather than leaving evidence only in discussion.
  status_values:
  - unreviewed
  - scene-reviewed
  - source-researched
  - ja-proposed
  - accepted
scenes:
- id: g-01
  title:
    de: Parteibewegung
    ja: 政党運動
  scene_type: mixed
  setting:
    situation: political associates arrange attendance at a meeting
  cast:
  - id: organizer
    description: Political associate who announces Eugen's speech and recruits attendees.
    evidence: "Heute Abend; Ich will Sie mit in die Versammlung nehmen; bringen Sie Andere mit"
    confidence: high
  - id: associate
    description: Interlocutor who asks about Eugen and declines an escort to the meeting.
    evidence: "Eugen ist da?; ich weiß den Weg"
    confidence: high
  - id: politician
    description: Eugen, a visiting political speaker discussed but not heard directly.
    evidence: "Er wird doch wohl eine Rede halten?"
    confidence: high
  reconstruction:
    confidence: high
    note: >-
      Entries 1-8 form a coherent polite exchange about Eugen's meeting. Entries 9-18 are a political
      vocabulary list, and entries 19-22 are independent election-result formulas. They should not be
      assigned to the opening speakers without further evidence.
  voice_profiles:
    organizer: {register: polite, traits: [informed, insistent]}
    associate: {register: polite, traits: [interested, independent]}
  turn_groups:
  - entries: [g-01-001, g-01-002, g-01-003, g-01-004, g-01-005, g-01-006, g-01-007, g-01-008]
    description: exchange arranging attendance at Eugen's speech
  - entries: [g-01-009, g-01-010, g-01-011, g-01-012, g-01-013, g-01-014, g-01-015, g-01-016, g-01-017, g-01-018]
    description: standalone political vocabulary
  - entries: [g-01-019, g-01-020, g-01-021, g-01-022]
    description: election and vote-count formulas
  review_comments:
  - >-
    The opening exchange is best read as associate (001, 003, 005, 007) alternating with organizer
    (002, 004, 006, 008). The repeated German Sie establishes reciprocal polite address, without by
    itself establishing age, rank, or gender.
  - >-
    Entries 009-018 are equivalence labels for nineteenth-century political institutions. Their
    Greek often supplies a functional ancient analogue rather than a historically exact equivalent.
