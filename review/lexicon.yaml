meta:
  source: lexicon.yaml
  source_description:
    de: 'Altgriechische (auch neue\textrm{\textmd{{*}}} gutgebildete) Bezeichnungen

      für moderne Begriffe aus dem Neugriechischen.\addcontentsline{toc}{section}{aus dem Neugriechischen}'
    ja_proposed: >-
      近代ギリシア語から採録した、近代の概念を表す古代ギリシア語
      （ならびに適切に造られた新語〔*印〕）
  review_scope: Translate the German headwords into Japanese and independently assess whether each Greek equivalent
    is Classical, later, Modern Greek, or a new formation/semantic extension.
  translation_review:
    status: complete-synchronized-awaiting-user-review
    entry_count: 138
    note: >-
      Japanese headwords have been reviewed throughout and synchronized into lexicon.yaml. Greek chronology
      and semantic-fit research remains deliberately independent: entries still marked unreviewed in
      greek_analysis have not been represented as researched.
  greek_research_progress:
    completed_sections:
    - lexicon-01
    - lexicon-02
    - lexicon-03
    - lexicon-04
    - lexicon-05
    - lexicon-06
    - lexicon-07
    in_progress_section: null
    status: complete
    method: LSJ lemma check followed by local-corpus checking where lexical form alone cannot establish the relevant sense.
  principles:
  - Preserve the German and Greek source readings unless a scan check confirms an error.
  - Treat the author's asterisk as evidence of intended new formation, not as a complete historical classification.
  - Distinguish ancient lexical attestation from attestation of the proposed modern sense.
  - Use concise Japanese dictionary labels, retaining nineteenth-century institutions and objects.
  - Prefer an established Japanese term to an unnecessary English loanword; retain familiar loanwords where substitution
    would obscure the object or historical usage.
  - Record morphology, chronology, semantic fit, and textual criticism in separate fields.
  period_classification_values:
  - classical-attested-same-sense
  - classical-attested-semantic-extension
  - post-classical-or-byzantine
  - modern-greek
  - modern-coinage-author-marked
  - modern-coinage-unmarked
  - malformed-or-textual-error
  - unreviewed
  semantic_fit_values:
  - exact
  - context-dependent
  - narrower
  - broader
  - approximate
  - misleading
  - unreviewed
  status_values:
  - unreviewed
  - ja-proposed
  - lexically-researched
  - accepted
  corpus_roots:
    canonical_corpus: /home/mrty/Documents/Resources/canonical-greekLit
    discovery_corpus: /home/mrty/Documents/Resources/ancient-greek-texts
    lsj: /home/mrty/Documents/Resources/LSJ_GreekUnicode
  edition_policy:
    base_edition: Leipzig 1889
    later_witness: 1902 printing digitized from Harvard
    policy: Preserve the 1889 text; record but do not silently adopt changes introduced in 1902.
    archive_identifier: sprechensieatti00johngoog
    later_witness_lexicon_pages: 73-77
    verification_note: The page locators refer only to the later 1902 witness, not to the 1889 base.
sections:
- id: lexicon-01
  title:
    de_editorial: Staat und Politik
    ja: 国家・政治
  source_heading: null
  entries:
  - id: lexicon-01-001
    source_locator:
      file: lexicon.yaml
      section_index: 1
      entry_index: 1
      fingerprint: e3130cee09886137
      later_1902_scan_page: 73
    source:
      modern:
      - de: Der Reichs\textcompwordmark{}tag
      grc:
      - ἡ βουλή.
    translation:
      de:
      - Der Reichs\textcompwordmark{}tag
      ja_proposed: \ruby{帝国議会}{ライヒスターク}
      decision: accepted
      rationale: >-
        The definite German Der Reichstag denotes the contemporary parliament of the German Empire. The ruby
        preserves the concise Japanese label 帝国議会 while identifying this institution specifically as the
        Reichstag and avoiding confusion with Japan's Imperial Diet.
      alternatives:
      - ja: 帝国議会
        nuance: Concise, but potentially ambiguous to Japanese readers.
      - ja: ライヒスターク
        nuance: Institutionally precise, but less immediately transparent.
    greek_analysis:
      display_forms:
      - ἡ βουλή.
      normalized_forms:
      - ἡ βουλή
      author_marked_new: false
      morphology:
      - form: ἡ
        lemma: ὁ, ἡ, τό
        parsing: nominative singular feminine definite article
        function: Marks βουλή as a feminine singular institutional noun.
      - form: βουλή
        lemma: βουλή
        parsing: nominative singular feminine, first declension
        function: Head noun; here used as the name of a deliberative political body.
      formation: >-
        A deverbal noun associated with βούλομαι and βουλεύω: the semantic development runs from will,
        counsel, or a plan to the body that deliberates and gives counsel.
      period_classification: classical-attested-semantic-extension
      ancient_sense: >-
        Counsel or a plan; institutionally, a council or senate. In democratic Athens ἡ βουλή normally denotes
        the Council of Five Hundred, a body selected by lot that prepared and administered business for the people.
      modern_sense: \ruby{帝国議会}{ライヒスターク}
      semantic_fit: approximate
      semantic_note: >-
        The equivalence is based on the broad shared feature “deliberative organ of state.” It is not an
        institutional identity. The Athenian βουλή was a council of 500 selected by lot, whereas the Reichstag
        was the elected representative chamber of the German Empire. In an Athenian frame, ἐκκλησία or δῆμος
        represents the citizen assembly, but neither is an exact equivalent of a modern representative parliament.
    attestations:
    - status: lexical-form-attested
      method: exact-corpus-surface-form
      target: ἡ βουλή.
      occurrence_count: 1252
      examples:
      - author: Aeschines
        work: aeschin_gk
        reference: null
        local_file: /home/mrty/Documents/Perseus/Classics/Aeschines/opensource/aeschin_gk.xml
        xml_line: 103
      - author: Aeschylus
        work: Eumenides
        reference: '620'
        local_file: /home/mrty/Documents/Perseus/Classics/Aeschylus/opensource/aesch.eum_gk.xml
        xml_line: 1120
      - author: Andocides
        work: andoc_gk
        reference: '15'
        local_file: /home/mrty/Documents/Perseus/Classics/Andocides/opensource/andoc_gk.xml
        xml_line: 84
      caution: Surface-form attestation establishes lexical occurrence only, not the nineteenth-century sense.
    - status: source-context-checked
      method: institutional-context
      target: ἡ βουλή
      source:
        author: Aristotle
        work: Athenian Constitution
        passage: 43.2-3
        local_file: /home/mrty/Documents/Perseus/Classics/Aristotle/opensource/aristot.ath.pol_gk.xml
      text_grc: >-
        βουλὴ δὲ κληροῦται φʹ, νʹ ἀπὸ φυλῆς ἑκάστης· ... οἱ δὲ πρυτανεύοντες ... συνάγουσιν
        καὶ τὴν βουλὴν καὶ τὸν δῆμον.
      literal_gloss_ja: >-
        評議会は籤で五百人が選ばれ、各部族から五十人ずつ出る。……当番評議員たちは評議会と民会とを招集する。
      context_note: >-
        Aristotle distinguishes the Council from the people/assembly and describes its composition and
        administrative role. This directly shows that βουλή is a council, not the ancient equivalent of an
        elected representative parliament.
      relationship_to_handbook: >-
        The handbook extends a Classical institutional word to a modern legislature by functional analogy.
    german_lexical_research: null
    textual_issues: []
    editorial_decision:
      decision: pending
      basis: null
    review_comments:
    - The Japanese rendering \ruby{帝国議会}{ライヒスターク} was accepted during manual review.
    status: accepted
  - id: lexicon-01-002
    source_locator:
      file: lexicon.yaml
      section_index: 1
      entry_index: 2
      fingerprint: c2e0e51e92ec7b98
      later_1902_scan_page: 73
    source:
      modern:
      - de: Der Abgeordnete.
      grc:
      - ὁ βουλευτής.
    translation:
      de:
      - Der Abgeordnete.
      ja_proposed: 議員
      decision: accepted
      rationale: >-
        議員 is the natural concise equivalent of Abgeordneter and works contextually after the preceding
        Reichstag entry. It remains broad enough not to imply that ancient βουλευτής itself meant an elected
        parliamentary representative.
      alternatives:
      - ja: 帝国議会議員
        nuance: Makes the nineteenth-century institution explicit, but repeats information supplied by the preceding entry.
      - ja: 代議士
        nuance: Emphasizes elected representation, but is narrower and can evoke a modern Japanese lower-house member.
    greek_analysis:
      display_forms:
      - ὁ βουλευτής.
      normalized_forms:
      - ὁ βουλευτής
      author_marked_new: false
      morphology:
      - form: ὁ
        lemma: ὁ, ἡ, τό
        parsing: nominative singular masculine definite article
        function: Marks βουλευτής as a masculine singular personal noun.
      - form: βουλευτής
        lemma: βουλευτής
        parsing: nominative singular masculine, first-declension masculine agent noun in -τής
        function: Head noun, “one who deliberates as a member of a council.”
      formation: >-
        Agent noun from βουλεύω, “deliberate, take counsel, serve as councillor,” itself related to βουλή.
      period_classification: classical-attested-semantic-extension
      ancient_sense: >-
        A councillor or senator; at Athens specifically a member of the Council of Five Hundred. Membership in
        that council was normally allotted rather than obtained through a modern representative election.
      modern_sense: 議員
      semantic_fit: approximate
      semantic_note: >-
        Abgeordneter denotes a deputy or representative and, after the preceding Reichstag entry, a member of
        the German Reichstag. βουλευτής supplies the institutional notion “member of a deliberative council,”
        but not the modern notion of an elected representative sent by a constituency.
    attestations:
    - status: lexical-form-attested
      method: exact-corpus-surface-form
      target: ὁ βουλευτής.
      occurrence_count: 17
      examples:
      - author: Aeschines
        work: aeschin_gk
        reference: null
        local_file: /home/mrty/Documents/Perseus/Classics/Aeschines/opensource/aeschin_gk.xml
        xml_line: 187
      - author: Anth
        work: 04_gk
        reference: '10'
        local_file: /home/mrty/Documents/Perseus/Classics/Anth/opensource/04_gk.xml
        xml_line: 1319
      - author: Appian
        work: appian.cw_gk
        reference: '98'
        local_file: /home/mrty/Documents/Perseus/Classics/Appian/opensource/appian.cw_gk.xml
        xml_line: 233
      caution: Surface-form attestation establishes lexical occurrence only, not the nineteenth-century sense.
    - status: source-context-checked
      method: institutional-context
      target: ὁ βουλευτής
      source:
        author: Aeschines
        work: Against Timarchus
        passage: 109
        local_file: /home/mrty/Documents/Perseus/Classics/Aeschines/opensource/aeschin_gk.xml
      text_grc: οὗτος, ὦ ἄνδρες Ἀθηναῖοι, βουλευτὴς ἐγένετο ἐπὶ ἄρχοντος Νικοφήμου.
      literal_gloss_ja: アテナイ人諸君、この男はニコペーモスがアルコーンであった年に評議員となった。
      context_note: >-
        Aeschines is cataloguing Timarchus' public offices and misconduct. βουλευτής names his membership in
        the Athenian Council, not representation of an electoral constituency.
      relationship_to_handbook: >-
        The handbook extends the ancient title of a council member to a modern parliamentary deputy.
    german_lexical_research: null
    textual_issues: []
    editorial_decision:
      decision: pending
      basis: null
    review_comments:
    - >-
      議員 was accepted during manual review because the immediately preceding Reichstag entry supplies the
      institutional context.
    status: accepted
