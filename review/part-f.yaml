          reply, 「ただいま、留守にしております」 is smoother than making 「ただいまは」 the topic.
          Aozora dialogue attests both 「只今……御不在でございます」 and
          「ただいまは……お留守じゃ」 patterns; the proposal chooses the neutral-polite form.
