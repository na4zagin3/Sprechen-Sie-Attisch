meta:
  source: part-f.yaml
  part_title:
    de: Im Hause.
    ja: 家の中で
  translation_style:
    basis:
    - part-a.yaml
    - part-b.yaml
    - part-c.yaml
    principles:
    - Prefer natural spoken Japanese appropriate to the reconstructed relationship.
    - Preserve the German wording except for explicitly identified source or OCR errors.
    - Distinguish the German prompt from the literal and pragmatic force of the Greek.
    - Check historical German meanings and idioms independently; record rather than conceal German-Greek mismatches.
    - Preserve nineteenth-century objects, institutions, and social conventions where relevant.
    - Reproduce emphasis in Japanese only when the corresponding German text is emphasized; Greek-only emphasis is not carried into ja_proposed.
    - Do not add politeness, intimacy, gender, or aggression without contextual evidence.
    - Use Japanese punctuation and sentence endings to make turn-taking natural.
  corpus_roots:
    perseus: /home/mrty/Documents/Resources/canonical-greekLit
    lsj: /home/mrty/Documents/Resources/LSJ_GreekUnicode
  attestation_match_types:
  - exact
  - near-exact
  - adapted
  - syntactic-parallel
  - formulaic-parallel
  - lexical-only
  - not-found
  evidence_policy:
    languages: [grc, de]
    note: >-
      Translation-relevant attestations must remain in this review YAML with original text, source,
      context, relationship to the handbook, confidence, and research method. Record unsuccessful
      searches and label inference explicitly rather than leaving evidence only in discussion.
  status_values:
  - unreviewed
  - scene-reviewed
  - source-researched
  - ja-proposed
  - accepted
scenes:
- id: f-01
  title:
    de: Da wohnt er
    ja: 彼はそこに住んでいる
  scene_type: reconstructed_dialogue
  setting:
    situation: a visitor asks for a resident and enters the house
  cast:
  - id: visitor
    description: Stranger asking directions and later calling at the house.
    evidence: Address inquiries, knocking, and request to be announced.
    confidence: high
  - id: resident
    description: Müller, the person being sought; seen at a window or reported absent or about to leave.
    evidence: Third-person references throughout the section.
    confidence: high
  - id: household-member
    description: Person answering from inside and giving the visitor information about Müller.
    evidence: Questions at the door and polite reports that Müller is absent.
    confidence: high
  reconstruction:
    confidence: high
    note: >-
      The section contains several reusable routes through one visiting scenario rather than a single
      continuous exchange. Entries 1-3 are alternative address inquiries; 5-8 give alternative
      developments after the address is supplied; 9-13 dramatize knocking and opening; 14-20 form a
      visitor-household exchange; 21-22 are alternative reports about the resident at the door.
  voice_profiles:
    visitor: {register: polite, traits: [courteous, persistent]}
    household-member: {register: polite, traits: [brief, informative]}
    inside-familiar: {register: plain, traits: [impatient]}
  turn_groups:
  - entries: [f-01-001, f-01-002, f-01-003, f-01-004]
    description: alternative polite inquiries followed by an address
    alternatives:
    - [f-01-001, f-01-002, f-01-003]
  - entries: [f-01-005, f-01-006, f-01-007, f-01-008]
    description: alternative information about moving or visually locating the resident
  - entries: [f-01-009, f-01-010, f-01-011, f-01-012, f-01-013]
    description: knocking, impatient commands to open, and identification of the caller
    alternatives:
    - [f-01-010, f-01-011, f-01-012]
  - entries: [f-01-014, f-01-015, f-01-016, f-01-017, f-01-018, f-01-019, f-01-020]
    description: visitor asks to be announced and learns that Müller is out walking
  - entries: [f-01-021, f-01-022]
    description: alternative reports that the resident is at the door or about to leave
