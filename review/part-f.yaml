    grammar:
      syntax: Present middle imperative, second person singular, of ἀποδύω/ἀποδύομαι; the omitted object is supplied by the situation.
      literal_gloss: Take [your clothing] off.
      particles_and_idioms:
      - Greek ἀποδύεσθαι normally denotes taking clothing or equipment off; it does not by itself specify footwear.
      - German etwas ablegen likewise leaves the object implicit, while the response sich ausziehen points to clothing.
      pragmatic_force: A familiar host invites or tells an arriving guest to remove outdoor clothing before sitting down.
    translation:
      variants:
      - de: Leg' ab!
        ja_current: 上着を脱いでくれ！
        ja_proposed: 上着を脱いでくれ！
        decision: revise
        rationale: >-
          Neither German nor Greek names a particular garment. In a respectable Leipzig visiting
          scene of 1889, visitors ordinarily retained their clean street shoes as part of their
          visiting dress, but put aside a hat and outdoor garment. 「服を脱いでくれ」 would suggest
          undressing too fully in Japanese, while 「履物を脱いでくれ」 is historically and lexically
          too specific; 「上着」 supplies the most plausible situational object.
        alternatives:
        - ja: 外套を脱いでくれ！
          note: Historically plausible and more literary, but specifies an overcoat more narrowly than the sources do.
        - ja: それを脱いでくれ！
          note: Preserves the omitted object but requires a visibly present garment and is less independently usable.
