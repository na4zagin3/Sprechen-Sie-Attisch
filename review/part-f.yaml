      text_grc: 'Ὅτι τὸ οὐδεὶς καθολικὸν μὲν εἶναι δοκεῖ ῥῆμα, ὡς μηδὲ ἓν πρόσωπον διὰ τῆς φωνῆς ταύτης ὑπεξῃρῆσθαι· ἔστι δὲ οὐχ οὕτω παρὰ τῇ Γραφῇ ἀναφερόμενον, ὡς τετηρήκαμεν ἐπὶ τοῦ, Οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ Θεός. οὐδὲ γὰρ ἐκεῖ ἑαυτὸν ἔξω τιθεὶς τῆς τοῦ ἀγαθοῦ φύσεως ὁ Υἱός, ταῦτα λέγει. ἀλλʼ ἐπειδὴ τὸ πρῶτον ἀγαθὸν ὁ Πατήρ, τὸ οὐδεὶς συνυπακουομένου τοῦ πρῶτος, εἰρῆσθαι πιστεύομεν. καὶ τὸ Οὐδεὶς οἶδε τὸν Υἱὸν εἰ μὴ ὁ Πατήρ. οὐδὲ γὰρ ἐκεῖ ἄγνοιαν τοῦ Πνεύματος κατηγορεῖ, ἀλλὰ πρώτῳ τῷ Πατρὶ ὑπάρχειν τὴν γνῶσιν τῆς ἑαυτοῦ φύσεως μαρτυρεῖ. οὕτω καὶ τὸ Οὐδεὶς οἶδε τὴν πρώτην εἴδησιν τῶν τε ὄντων καὶ τῶν ἐσομένων ἐπὶ τὸν Πατέρα ἀνάγοντος, καὶ διὰ πάντων τὴν πρώτην αἰτίαν τοῖς ἀνθρώποις ὑποδεικνύντος εἰρῆσθαι νομίζομεν. ἐπεὶ πῶς ἢ ταῖς λοιπαῖς μαρτυρίαις τῆς Γραφῆς ἀκολουθεῖ τὸ ῥητόν, ἢ ταῖς κοιναῖς ἡμῶν ἐννοίαις συμβαίνειν δύναται, τῶν πεπιστευκότων εἰκόνα δὲ εἶναι τοῦ Θεοῦ τοῦ ἀοράτου τὸν Μονογενῆ, εἰκόνα δέ, οὐ χαρακτῆρος σωματικοῦ, ἀλλʼ αὐτῆς τῆς θεότητος, καὶ τῶν ἐπινοουμένων τῇ οὐσίᾳ τοῦ Θεοῦ μεγαλείων, εἰκόνα δυνάμεως, εἰκόνα σοφίας, καθὸ εἴρηται Χριστὸς Θεοῦ δύναμις καὶ Θεοῦ σοφία; μέρος δὲ δηλονότι τῆς σοφίας ἡ γνῶσις· ἣν οὐκ ἐξεικονίζει  πᾶσαν, εἴπερ τινῶν ἀπολείπεται. πῶς δὲ καὶ ὁ Πατήρ, δι’ οὗ τοὺς αἰῶνας ἐποίησε, τούτῳ τὸ ἐλάχιστον μέρος τῶν αἰώνων, τὴν ἡμέραν ἐκείνην καὶ τὴν ὥραν, οὐκ ἔδειξεν; ἢ πῶς ὁ τῶν ὅλων ποιητὴς τοῦ ἐλαχίστου μέρους τῶν ὑπʼ αὐτοῦ κτισθέντων τῆς γνώσεως ἀπολείπεται; ὁ δὲ λέγων, πλησίον τοῦ τέλους, τάδε καὶ τάδε ἐν τῷ οὐρανῷ σημεῖα καὶ ἐν τοῖς κατὰ γῆν χωρίοις φανήσεσθαι, πῶς αὐτὸ τὸ τέλος ἀγνοεῖ; ἐν οἷς γὰρ λέγει, Οὔπω τὸ τέλος, οὐχ ὡς ἀμφιβάλλων, ἀλλʼ ὡς εἰδὼς διορίζεται. ἔπειτα μέντοι εὐγνωμόνως σκοποῦντι, πολλὰ καὶ ἀπὸ τοῦ ἀνθρωπίνου μέρους ὁ Κύριος διαλέγεται τοῖς ἀνθρώποις· οἷον, Δός μοι πιεῖν, φωνή ἐστι τοῦ Κυρίου τὴν σωματικὴν χρείαν ἐκπληροῦσα. καίτοι ὁ αἰτῶν οὐχὶ σὰρξ ἦν ἄψυχος, ἀλλὰ θεότης σαρκὶ ἐμψύχῳ κεχρημένη. οὕτω καὶ νῦν τὸ τῆς ἀγνοίας ἐπὶ τὸν οἰκονομικῶς πάντα καταδεξάμενον, καὶ προκόπτοντα παρὰ Θεῷ καὶ ἀνθρώποις σο