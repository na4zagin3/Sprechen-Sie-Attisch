      - de: Steh' \emph{wieder} auf!
        ja_current: もう一度立て！
        ja_proposed: では、立ちなさい！
        decision: revise
        rationale: >-
          German wieder means returning to a standing position after the preceding objection to
          sitting, rather than repeating an exercise. Japanese 「もう一度立て」 sounds mechanically
          repetitive, while the preceding context already supplies the change of posture.
          「では、立ちなさい」 expresses the corrective consequence naturally. The German emphasis
          is intentionally not reproduced because it has no natural independent scope in Japanese.
