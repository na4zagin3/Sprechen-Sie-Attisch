  - id: i-01-002
    source_locator:
      file: part-i.yaml
      section_index: 1
      conversation_index: 2
      fingerprint: 9203f10365d65f82
    source:
      modern:
      - de: Eines Mannes Rede ist keine Rede.
        ja: 一方の言い分だけでは、裁きは下せない。
      grc:
      - πρὶν ἂν ἀμφοῖν μῦθον ἀκούσῃς, οὐκ ἂν δικάσαις.
    dialogue:
      speaker:
        candidate: generic-speaker
        confidence: high
      addressee:
        candidate: prospective-judge
        confidence: high
      speech_act: advise-hearing-both-sides
      tone:
      - cautionary
      responds_to: null
      followed_by: null
      alternatives: []
    grammar:
      syntax: >
        πρὶν ἂν with the subjunctive ἀκούσῃς sets a future condition, “before you have heard.”
        ἀμφοῖν is dual genitive, “from both”; μῦθον is the account of each side. The potential
        optative δικάσαις with ἄν means “you could not judge.”
      literal_gloss: 両者の言い分を聞くまでは、裁きを下すことはできない。
      particles_and_idioms:
      - form: ἀμφοῖν
        function: explicitly requires both parties, not merely more than one report
      pragmatic_force: warns against judgment based on only one party's account
    translation:
      variants:
      - de: Eines Mannes Rede ist keine Rede.
        ja_current: 一方の言い分だけでは、裁きは下せない。
        ja_proposed: 一方の言い分だけでは、裁きは下せない。
        decision: revise
        rationale: >
          This keeps the German proverb's compact, impersonal form while making “one man's account”
          idiomatic Japanese. The literal Greek explicitly says to hear both parties before judging.
        alternatives: []
      register: proverbial-neutral
      scene_dependency: independent maxim
    attestations:
    - target: πρὶν ἂν ἀμφοῖν μῦθον ἀκούσῃς, οὐκ ἂν δικάσαις.
      status: source-context-checked
      match_type: exact
      reference_as_given: null
      source:
        author: Aristophanes
        work: Wasps
        passage: '725'
        local_file: /home/mrty/Documents/Resources/canonical-greekLit/data/tlg0019/tlg004/tlg0019.tlg004.perseus-grc2.xml
      text_grc: πρὶν ἂν ἀμφοῖν μῦθον ἀκούσῃς, οὐκ ἂν δικάσαις.
      original_speakers:
      - Χορος
      original_speaker_beta: '*xoro/s'
      original_scene: >
        Wasps 725-726. After hearing Bdelycleon’s rebuttal of his father Philocleon’s praise of jury
        service, the chorus concedes that one should not judge before hearing both sides and says
        Bdelycleon now appears clearly to have won.
      beta_context: soi plhn kwlakretou gala pinein xoros h pou sofos hn ostis efasken prin an amfoin
        muqon akoushs ouk an dikasais su gar oun nun moi nikan pollw dedokhsai wst hdh thn orghn
      relationship_to_handbook: >
        Verbatim maxim. German Eines Mannes Rede ist keine Rede compresses the explicit legal image
        “hear both accounts before judging.”
      adaptations:
      - second-person judicial formulation recast as an impersonal German proverb
      confidence: high
