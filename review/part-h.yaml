meta:
  source: part-h.yaml
  part_title:
    de: Beim Skat\textcompwordmark{}spiel.
    ja: スカート（Skat）をするとき
  translation_style:
    basis:
    - part-a.yaml
    - part-b.yaml
    - part-c.yaml
    principles:
    - Prefer natural spoken Japanese appropriate to the reconstructed relationship.
    - Preserve the German wording except for explicitly identified source or OCR errors.
    - Distinguish the German prompt from the literal and pragmatic force of the Greek.
    - Check historical German meanings and idioms independently; record rather than conceal German-Greek mismatches.
    - Preserve nineteenth-century objects, institutions, and social conventions where relevant.
    - Reproduce emphasis in Japanese only when the corresponding German text is emphasized; Greek-only emphasis is not carried into ja_proposed.
    - Do not add politeness, intimacy, gender, or aggression without contextual evidence.
    - Use Japanese punctuation and sentence endings to make turn-taking natural.
  corpus_roots:
    lsj: /home/mrty/Documents/Resources/LSJ_GreekUnicode
    canonical_corpus: /home/mrty/Documents/Resources/canonical-greekLit
    discovery_corpus: /home/mrty/Documents/Resources/ancient-greek-texts
  domain_lexicon: review/part-h-skat-lexicon.yaml
  attestation_match_types:
  - exact
  - near-exact
  - adapted
  - syntactic-parallel
  - formulaic-parallel
  - lexical-only
  - not-found
  evidence_policy:
    languages: [grc, de]
    note: >-
      Translation-relevant attestations must remain in this review YAML with original text, source,
      context, relationship to the handbook, confidence, and research method. Record unsuccessful
      searches and label inference explicitly rather than leaving evidence only in discussion.
  status_values:
  - unreviewed
  - scene-reviewed
  - source-researched
  - ja-proposed
  - accepted
scenes:
- id: h-01
  title:
    de: Ein Spiel mit Redens\textcompwordmark{}arten
    ja: 言い回しを交えた一局
  scene_type: mixed
  setting:
    situation: several players begin and conduct a game of Skat
  cast:
  - id: player-a
    description: One of several model players; exact turns are not securely recoverable.
    evidence: Alternation between polite Sie and familiar du prevents a stable assignment.
    confidence: low
  - id: player-b
    description: Possible partner or opponent in short stretches of play.
    evidence: First-person plural alternates between inclusive table talk and a two-player side.
    confidence: low
  - id: player-c
    description: Third Skat player required by the game, but not explicitly labelled.
    evidence: Skat requires three active players; the section supplies no A/B/C labels.
    confidence: medium
  reconstruction:
    confidence: high
    note: >-
      This is a phrase exercise staged around Skat, not one recoverable deal. Entries 1-20 establish
      the game and early play; 21-39 string together reusable idioms, accusations, and reactions;
      40-45 close with counting, loss, and payment. The German alternates Sie and du, so Japanese
      follows each local model phrase rather than inventing fixed relationships.
  voice_profiles:
    polite-model-turns: {register: polite, traits: [competitive, socially_controlled]}
    familiar-model-turns: {register: plain, traits: [excited, teasing, accusatory]}
  turn_groups:
  - entries: [h-01-001, h-01-002, h-01-003, h-01-004, h-01-005, h-01-006, h-01-007, h-01-008, h-01-009, h-01-010, h-01-011]
