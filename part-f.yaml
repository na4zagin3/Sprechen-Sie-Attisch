part:
  de: Im Hause.
  ja: 家の中で
sections:
  - title:
      de: Da wohnt er
      ja: 彼はそこに住んでいる
    conversations:
      - modern:
        - de: Werden Sie mir wohl sagen können, wo hier Herr M. wohnt?
          ja: M氏のお宅がどちらか、教えていただけますか？
        grc:
          - ἔχοις ἂν φράσαι μοι (τόν κύριον{*}) Μύλλερον, ὅπου ἐνθάδε οἰκεῖ;
      - modern:
        - de: Ich möchte gern erfahren, wo Müller wohnt.
          ja: ミュラー氏がどちらにお住まいか、伺いたいのですが。
        grc:
          - ἡδέως ἂν μάθοιμι, ποῦ Μύλλερος οἰκεῖ.
      - modern:
        - de: Das möchte ich gern wissen.
          ja: ぜひ、それを教えて下さいませんか。
        grc:
          - τοῦτ’ με δίδαξον!
      - modern:
        - de: In der Leipziger Straße.
          ja: ライプツィヒ通りです。
        grc:
          - ἐν τῇ Λειψιανῇ{*} ὁδῷ.
      - modern:
        - de: Er zieht aus.
          ja: 彼は引っ越すところです。
        grc:
          - μετοικίζεται.
      - modern:
        - de: Er ist aus\textcompwordmark{}gezogen.
          ja: 彼なら、もう引っ越してしまいました。
        grc:
          - φροῦδός ἐστιν ἐξῳκισμένος.
      - modern:
        - de: Da sieht er zum Fenster heraus!
          ja: ほら、窓からこちらを窺いています！
        grc:
          - ὁδὶ ἐκ θυρίδος παρακύπτει.
      - modern:
        - de: Das ist er.
          ja: あれが、その人です。
        grc:
          - \emph{οὗτός ἐστ’ ἐκεῖνος.}
      - modern:
        - de: Wer klopft?
          ja: 戸を叩いているのは誰だ？
        grc:
          - τίς ἐσθ’ ὁ τὴν θύραν κόπτων;
      - modern:
        - de: "Mach' die Thür auf!"
          ja: 戸を開けてくれ！
        grc:
          - ἄνοιγε τὴν θύραν!
      - modern:
        - de: "Mach' doch auf!"
          ja: まだ開けないのか！
        grc:
          - οὐκ ἀνοίξεις;
      - modern:
        - de: "Mach' endlich die Thür auf!"
          ja: いい加減戸を開けろ！
        grc:
          - ἄνοιγ’ \emph{ἀνύσας} τὴν θύραν.
      - modern:
        - de: Wer ist da?
          ja: どなたですか？
        grc:
          - τίς οὗτος;
      - modern:
        - de: Melden Sie mich!
          ja: 私が来たと、お取り次ぎください。
        grc:
          - εἰσάγγειλον\footnote{\textlatin{orig.} εἰςάγγειλον}.
      - modern:
        - de: Ich weiß Ihren Namen nicht genau.
          ja: お名前を正確には存じません。
        grc:
          - οὐκ οἶδ’ ἀκριβῶς σου τοὔνομα.
      - modern:
        - de: Ist Müller zu Hause?
          ja: ミュラー氏はご在宅ですか？
        grc:
          - \emph{ἔνδον} ἐστὶ Μύλλερος;
      - modern:
        - de: Nein, er ist nicht zu Hause.
          ja: いいえ、留守です。
        grc:
          - οὐκ ἔνδον ἐστίν.
      - modern:
        - de: \emph{Augenblicklich} ist er nicht zu Hause.
          ja: \kenten{ただいま}、留守にしております。
        grc:
          - οὐκ ἔνδον ὢν τυγχάνει.
      - modern:
        - de: Er ist spazieren.
          ja: 散歩に出ております。
        grc:
          - περίπατον ποιεῖται.
      - modern:
        - de: So?
          ja: そうですか？
        grc:
          - ἄληθες;
      - modern:
        - de: Er steht an der Thür.
          ja: 彼は戸口に立っています。
        grc:
          - ἐπὶ ταῖς θύραις ἕστηκεν.
      - modern:
        - de: Er ist im Begriff aus\textcompwordmark{}zugehen.
          ja: 彼は今まさに出かけようとしています。
        grc:
          - μέλλει \emph{θύραζε βαδίζειν.}
  - title:
      de: Am Morgen
      ja: 朝
    conversations:
      - modern:
        - de: Er ist im Schlafzimmer.
          ja: 彼は寝室にいます。
        grc:
          - ἐστὶν ἐν τῷ δωματίῳ.
      - modern:
        - de: Das Bett.
          ja: 寝床。
        grc:
          - τὰ \emph{στρώματα.}
      - modern:
        - de: Im Bette.
          ja: 寝床の中で。
        grc:
          - ἐν τοῖς στρώμασιν.
      - modern:
        - de: Er schläft eben.
          ja: 彼はいま、眠っているところです。
        grc:
          - ἀρτίως εὕδει.
      - modern:
        - de: "Du, wach' auf!"
          ja: おい、起きろ！
        grc:
          - οὗτος, ἐγείρου!
      - modern:
        - de: "Steh' auf!"
          ja: 起き上がれ！
        grc:
          - ἀνίστασο!
      - modern:
        - de: Zünde Licht an!
          ja: 灯をともせ！
        grc:
          - ἅπτε λύχνον!
      - modern:
        - de: Sehr wohl.
          ja: かしこまりました。
        grc:
          - ταῦτα.
      - modern:
        - de: Hast du dich gewaschen?
          ja: もう顔や手は洗ったか？
        grc:
          - ἆρ’ ἀπονένιψαι;
      - modern:
        - de: Kannst du \emph{ohne} Handtuch zurechtkommen?
          ja: \kenten{手拭いなしで}済ませるつもりか？
        grc:
          - ἀνύτεις χειρόμακτρον οὐκ ἔχων;
      - modern:
        - de: Du siehst schrecklich schmutzig aus.
          ja: ずいぶん薄汚れているぞ。
        grc:
          - αὐχμεῖς αἰσχρῶς.
      - modern:
        - de: Er hat sich nicht gebadet.
          ja: 彼は体を洗わなかった。
        grc:
          - οὐκ ἐλούσατο.
      - modern:
        - de: "Wisch' den Tisch ab!"
          ja: 食卓を拭きなさい！
        grc:
          - ἀποκάθαιρε τὴν τράπεζαν!
      - modern:
        - de: Ich will zu hause bleiben.
          ja: 家にいることにするよ。
        grc:
          - οἴκοι μενῶ.
      - modern:
        - de: Wir wollen zu Hause bei mir studiren.
          ja: 僕の家で一緒に勉強しよう。
        grc:
          - ἔνδον παρ’ ἐμοὶ διατρίψομεν (περὶ τὰ μαθήματα).
      - modern:
        - de: Bei dir?
          ja: 君の家で？
        grc:
          - παρὰ σοί;
      - modern:
        - de: Ganz recht.
          ja: そうとも。
        grc:
          - πάνυ.
      - modern:
        - de: Du warst gestern bei mir.
          ja: 昨日は君がうちに来たね。
        grc:
          - παρ’ ἐμοὶ χθὲς ἦσθα.
      - modern:
        - de: Kommt heute in meine Wohnung!
          ja: 今日はみんな、うちへおいで！
        grc:
          - ἥκετ’ \emph{εἰς ἐμοῦ} τήμερον!
  - title:
      de: Sitzen. Stehen
      ja: 座る・立つ
    conversations:
      - modern:
        - de: "Leg' ab!"
          ja: 上着を脱いでくれ！
        grc:
          - ἀποδύου!
      - modern:
        - de: Ich ziehe mich schon aus.
          ja: もう脱いでいるところだよ。
        grc:
          - καὶ δὴ ἐκδύομαι.
      - modern:
        - de: Wohin wollen wir uns setzen?
          ja: どこに座ろうか？
        grc:
          - \emph{ποῦ} καθιζησόμεθα;
      - modern:
        - de: Nehmt Platz!
          ja: 皆さん、お掛けください！
        grc:
          - κάθησθε!
      - modern:
        - de: Setzen Sie sich!
          ja: お掛けください！
        - de: "Setz' dich nieder!"
          ja: 座りなさい！
        grc:
          - κάθιζε!
      - modern:
        - de: Wenn du erlaubst!
          ja: 君さえよければ。
        grc:
          - εἰ ταῦτα \emph{δοκεῖ!}
      - modern:
        - de: So, ich sitze.
          ja: ほら、座ったよ。
        grc:
          - ἰδού· κάθημαι.
      - modern:
        - de: Ich sitze schon!
          ja: とっくに座っているよ。
        grc:
          - κάθημαι ’γὼ πάλαι.
      - modern:
        - de: Du hast keinen guten Platz.
          ja: 君の席は、あまりよくないね。
        grc:
          - οὐ καθίζεις ἐν καλῷ.
      - modern:
        - de: Hast du nichts zu essen?
          ja: 何か食べるものはないのか？
        grc:
          - οὐκ ἔχεις καταφαγεῖν;
      - modern:
        - de: \emph{Darf ich} dir ein Abendbrot vorsetzen?
          ja: 夕食を\kenten{お出ししましょうか}？
        grc:
          - βούλει παραθῶ σοι δόρπον.
      - modern:
        - de: Ich bitte nur um ein Stück Brot und Fleisch.
          ja: パンと肉を少しだけいただきたいのですが。
        grc:
          - αἰτῶ λαβεῖν τιν’ ἄρτον καὶ κρέας.!
      - modern:
        - de: Ich habe mir zu trinken \emph{mitgebracht}.
          ja: 飲み物なら\kenten{持ってきた}よ。
        grc:
          - \emph{ἥκω φέρων} πιεῖν.
      - modern:
        - de: Gieb mir einmal zu trinken!
          ja: ちょっと、飲み物をくれ。
        grc:
          - δός μοι πιεῖν.
      - modern:
        - de: Gleich.
          ja: はい、ただいま。
        grc:
          - ἰδού.
      - modern:
        - de: Es ist unrecht, daß du hier sitzest.
          ja: 君がここに座っているのは、よろしくない。
        grc:
          - ἀδικεῖς ἐνθάδε καθήμενος.
      - modern:
        - de: "Steh' \\emph{wieder} auf!"
          ja: では、立ちなさい！
        grc:
          - ἀνίστασο!
      - modern:
        - de: "So steh' doch schnell auf, ehe dich jemand sieht!"
          ja: 誰かに見られないうちに、早く立たないか！
        grc:
          - ούκουν ἀναστήσει ταχύ, πρίν τινά σ’ ἰδεῖν;
      - modern:
        - de: "Steh' gerade!"
          ja: 気をつけ！
        grc:
          - ἀνίστασο ὀρθός.
      - modern:
        - de: "\\emph{Bleib'} stehen!"
          ja: \kenten{そのまま}立っていろ！
        grc:
          - στῆθι.
      - modern:
        - de: Zu Befehl, Herr Hauptmann!
          ja: はっ、承知しました、大尉殿！
        grc:
          - ταῦτα, ὦ λοχαγέ!
  - title:
      de: Frau und Kinder
      ja: 妻と子ども
    conversations:
      - modern:
        - de: Sie hat einen kleinen Jungen bekommen.
          ja: 彼女は男の子を産んだ。
        grc:
          - ἄρρεν ἔτεκε παιδίον.
      - modern:
        - de: Er hat viele kleine Kinder zu ernähren.
          ja: 彼には養うべき小さな子がたくさんいる。
        grc:
          - βόσκει μικρὰ πολλὰ παιδία.
      - modern:
        - de: Wo sind die Kinder?
          ja: 子どもたちはどこだ？
        grc:
          - ποῦ τὰ παιδία;
      - modern:
        - de: Wo ist meine Frau hin?
          ja: 私の妻は、いったいどこへ行った？
        grc:
          - ποῖ ἡ γυνὴ φρούδη ’στίν;
      - modern:
        - de: Wer kann mir sagen, wo meine Frau ist?
          ja: 妻がどこにいるか、誰か教えてくれないか？
        grc:
          - τίς ἂν φράσειε, ποῦ ’στι ἡ γυνή;
      - modern:
        - de: Sie wäscht und päppelt das Kind.
          ja: 彼女は子どもの体を洗い、食べさせてやっている。
        grc:
          - λούει καὶ ψωμίζει τὸ παιδίον.
      - modern:
        - de: Die Kinder sind gewaschen.
          ja: 子どもたちは、もう綺麗に洗ってもらっている。
        grc:
          - ἀπονενιμμένα ἐστὶ τὰ παιδία.
      - modern:
        - de: Sie bringt die Kinder zu Bette.
          ja: 彼女は子どもたちを寝かしつける。
        grc:
          - κατακλίνει τὰ παιδία.
      - modern:
        - de: Es ist \emph{höchste} Zeit.
          ja: もう、\kenten{とっくに}寝かせる時間だ。
        grc:
          - καιρὸς δέ.
      - modern:
        - de: Ihr habt lange genug gespielt.
          ja: みんな、もう十分遊んだでしょう。
        grc:
          - ἱκανὸν κρόνον ἐπαίζετε.
      - modern:
        - de: Sie würfeln. — Um was?
          ja: 彼らはサイコロを振っている\—{}何を賭けているのだろうか？
        grc:
          - κυβεύουσιν. — περὶ τοῦ;
      - modern:
        - de: Sei artig!
          ja: 行儀よくしなさい！
        grc:
          - κοσμίως ἔχε!
      - modern:
        - de: "Thu' das ja nicht!"
          ja: 決してそんなことをしてはいけません！
        grc:
          - μηδαμῶς τοῦτ’ ἐργάσῃ!
      - modern:
        - de: "Da, schau' einmal!"
          ja: ほら、見てごらん！
        grc:
          - ἰδού· θέασαι!
      - modern:
        - de: Der Onkel hat hübsche Geschenke mitgebracht.
          ja: 叔父さんが、素敵な贈り物を持ってきてくれたよ。
        grc:
          - ὁ θεῖος ἥκει φέρων δῶρα χαρίεντα.!
      - modern:
        - de: Lies\textcompwordmark{}chen klatscht vor Freude in die Hände.
          ja: リースヒェンは、喜んで手を叩いている。
        grc:
          - Λουίσιον{*} τὼ χεῖρ’ ἀνακροτεῖ ὑφ’ ἡδονῆς.!
      - modern:
        - de: Meine Frau ist nicht zu sehen.
          ja: 妻の姿が見えない。
        grc:
          - ἡ δὲ γυνὴ \emph{οὐ φαίνεται.}
      - modern:
        - de: Suchst du mich etwa?
          ja: もしかして、私を探しているの？
        grc:
          - μῶν ἐμὲ ζητεῖς;
      - modern:
        - de: Komm her, mein goldiger Schatz!
          ja: さあ、こっちへおいで、愛しい人！
        grc:
          - δεῦρό νυν, ὦ χρυσίον.
  - title:
      de: Kinderkrawall
      ja: 子どもたちの騒ぎ
    conversations:
      - modern:
        - de: Das ist Unrecht von dir.
          ja: そんなことをするなんて、お前が悪いぞ。
        grc:
          - ταῦτ’ οὐκ ὀρθῶς ποιεῖς.
      - modern:
        - de: Das ist unrecht, daß du mir das thust.
          ja: 僕にそんなことをするなんて、ずるいぞ。
        grc:
          - ἀδικεῖς γέ με τοῦτο ποιῶν.
      - modern:
        - de: "Wenn du mich ärgern willst, so soll dir's schlecht gehen!"
          ja: 僕にちょっかいを出すなら、ただではおかないぞ！
        grc:
          - ἤν τι λυπῇς με, οὐ χαιρήσεις!
      - modern:
        - de: "Gieb mir's wieder!"
          ja: それを返せ！
        grc:
          - ἀλλ’ ἀπόδος αὐτό!
      - modern:
        - de: Oder du sollst sehen (= ich ergreife andere Maßregeln)!
          ja: さもないと、こっちにも考えがあるぞ！
        grc:
          - ἢ τἀπὶ τούτοις δρῶ.
      - modern:
        - de: Soll ich dir eine Ohrfeige geben?
          ja: ひっぱたいてやろうか？
        grc:
          - τὴν γνάθον βούλει θένω;
      - modern:
        - de: Das sollst du nicht umsonst gesagt haben!
          ja: 今の言葉、ただでは済まさないぞ！
        grc:
          - οὐ μὰ ∆ία σὺ καταπροίξει τοῦτο \emph{λέγων!}
      - modern:
        - de: Was hast du vor?
          ja: 何をする気だ？
        grc:
          - τί μέλλεις δρᾶν;
      - modern:
        - de: Du sollst gehörige Prügel bekommen.
          ja: たっぷりぶって、泣かせてやるぞ！
        grc:
          - κλαύσει μακρά.
      - modern:
        - de: "(Daß du berstest!) Hol' dich der Kuckuck!"
          ja: くたばってしまえ！
        grc:
          - διαρραγείης!
      - modern:
        - de: Da hast du eine Backpfeife!
          ja: ほら、これでもくらえ！
        grc:
          - οὑτοσί σοι κόνδυλος!
      - modern:
        - de: "Zum Donnerwetter!Immer hau' ihn!"
          ja: ちくしょう！もっと殴れ！
        grc:
          - ἐς κόρακας!
      - modern:
        - de: "Wart', ich will dir's weisen!"
          ja: 待て、思い知らせてやる！
        grc:
          - παῖε παῖε!
      - modern:
        - de: Kommt mir nicht zu nahe!
          ja: お前たち、近寄るな！
        grc:
          - μὴ πρόσιτε.
      - modern:
        - de: Hurrah!
          ja: 万歳！
        grc:
          - ἀλαλαί!
      - modern:
        - de: Jetzt haben wir ihn!
          ja: さあ、今度こそ捕まえたぞ！
        grc:
          - νῦν ἔχεται μέσος!
      - modern:
        - de: Wollt ihr weg!
          ja: さあ、行った、行った！
        grc:
          - οὐχὶ σοῦσθε;
      - modern:
        - de: Wir sollt ihr nicht wieder kommen!
          ja: もう二度と来るんじゃないぞ！
        grc:
          - οὐδὲν ἄν με φλαῦρον ἔτι ἐργάσαισθε.
  - title:
      de: Kinderzucht
      ja: 子どものしつけ
    conversations:
      - modern:
        - de: Was ist das für ein Lärm da drin?
          ja: 中で何の騒ぎだ？
        grc:
          - τίς οὗτος ὁ ἔνδον θόρυβος;
      - modern:
        - de: Schreit nicht so!
          ja: そう大声を出すな！
        grc:
          - μὴ βοᾶτε! — μὴ βοᾶτε μηδαμῶς! — μὴ κεκράγατε!
      - modern:
        - de: So hört doch endlich!
          ja: いい加減、言うことを聞きなさい！
        grc:
          - οὐκ ἄκούσεσθε ἐτεόν;
      - modern:
        - de: "Was giebt's?"
          ja: 何があった？
        grc:
          - τί ἔστιν;
      - modern:
        - de: Was ist los? Um was handelt es sich?
          ja: いったい、何事だ？
        grc:
          - τί τὸ πρᾶγμα;
      - modern:
        - de: Wer schreit \emph{nach mir?}
          ja: 誰だ、\kenten{私を呼んでいる}のは？
        grc:
          - τίς ὁ βοῶν με;
      - modern:
        - de: "Soll ich's sagen?"
          ja: 言ってもいいですか？
        grc:
          - εἴπω;
      - modern:
        - de: Erzähle es mir!
          ja: さあ、話してごらん。
        grc:
          - κάτειπέ μοι.
      - modern:
        - de: Karl hat uns geprügelt.
          ja: カールが僕たちをぶったんです。
        grc:
          - Κάρολος πληγὰς ἡμῖν ἐνέβαλλεν.
      - modern:
        - de: "Ist's möglich?"
          ja: なんだって？
        grc:
          - τί φής!
      - modern:
        - de: Und was war dir Ursache davon?
          ja: それで、何が原因だったんだ？
        grc:
          - ἡ δ’ αἰτία τίς ἦν;
      - modern:
        - de: Warum?
          ja: なぜだ？
        grc:
          - τιή;
      - modern:
        - de: So hitzig?
          ja: なんて気が短いんだ！
        grc:
          - ὡς ὀξύθυμος!
      - modern:
        - de: Das ist immer so deine Art!
          ja: まったく、お前はいつもそうだ！
        grc:
          - οὗτος ὁ τρόπος πανταχοῦ!
      - modern:
        - de: Ich bin nicht schuld daran.
          ja: 僕のせいじゃない。
        grc:
          - οὐκ ἐγὼ τούτων αἴτιος.
      - modern:
        - de: Ja mit mir hat er es ebenso gemacht.
          ja: そうです、僕にも同じことをしました。
        grc:
          - νὴ ∆ία, κἀμὲ τοῦτ’ ἔδρασε ταὐτόν.
      - modern:
        - de: Du willst es in Abrede stellen?
          ja: しらを切るつもりか？
        grc:
          - ἀρνεῖ;
      - modern:
        - de: Nicht gemuckst!
          ja: 一言も口答えするな！
        grc:
          - μὴ γρύξῃς!
      - modern:
        - de: Daß du mir keine Lügen sagst!
          ja: 私に嘘をつくんじゃないぞ！
        grc:
          - ὅπως ἐρεῖς μηδὲν ψεῦδος!
      - modern:
        - de: Du verdienst Schläge.
          ja: お前は殴られて当然だ。
        grc:
          - ἄξιος εἶ πληγὰς λαβεῖν.
      - modern:
        - de: "Du, halt' einmal! Wo rennst du hin?"
          ja: こら、待ちなさい！どこへ駆けていくんだ？
        grc:
          - ἐπίσχες, οὗτος! ποῖ θεῖς;
      - modern:
        - de: Sei nicht böse, lieber Vater!
          ja: 怒らないでよ、お父さん！
        grc:
          - μηδὲν ἀγανάακτει, ὦ πάτερ!
      - modern:
        - de: Man muß sich todtärgern!
          ja: もう、腹が立って張り裂けそうだ！
        grc:
          - οἴμοι, διαρραγήσομαι.
